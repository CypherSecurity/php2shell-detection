; =============================================================================
; php2shell — PHP-FPM pool hardening
; CVE-2026-109618 (OOM-corruption RCE) / CVE-2026-109619 (stale-global-state RCE)
; Advisory: PHP 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 release, 2026-10-21 14:00 UTC
;           GHSA-w8hw-w9fx-j79w (109618), GHSA-6wmf-4rv5-p3rp (109619)
; =============================================================================
;
; WHAT THIS FILE IS
; -----------------
; A POOL-SCOPED fragment. These directives are only valid inside a PHP-FPM
; pool block, i.e. BELOW a [www] / [site] header in
; /etc/php/<ver>/fpm/pool.d/*.conf. Paste them into the pool that serves PHP
; (usually [www]) or into every per-site pool.
;
; Do NOT `include =` this file from php-fpm.conf at global scope: FPM will
; reject pool directives there. If your configuration management requires a
; separate include file, add a pool header yourself:
;
;     [www]
;     include = /etc/php/8.5/fpm/pool.d/php2shell-hardening.conf
;
; (and make sure the pool is not already defined elsewhere).
;
; WHY POOL-LEVEL php_admin_* AND NOT php.ini
; ------------------------------------------
; php_admin_value / php_admin_flag cannot be overridden by .user.ini,
; ini_set(), or a per-directory .htaccess. That matters here: an application
; (or an attacker who can write .user.ini) must not be able to turn
; session.upload_progress back on. Use php_admin_* everywhere below.
;
; THE REAL FIX IS THE PATCH. These settings are compensating controls that
; remove specific exploitation primitives; they do not fix the parser or the
; shutdown-state bugs. Patch to the fixed release first.
; =============================================================================


; -----------------------------------------------------------------------------
; 1. memory_limit — remove the controllable OOM failure (CVE-2026-109618)
; -----------------------------------------------------------------------------
; OFFICIAL RATIONALE: CVE-2026-109618 is triggered by a failed request
; allocation. PHP handles OOM with longjmp(); the advisory's official trigger
; shapes (chunked multipart without Content-Length, part-header floods, empty
; file controls + deep nesting) all work by making the attacker able to drive
; request memory into that failure while staying under post_max_size.
;
; Setting memory_limit to -1 removes the controllable failure point: PHP can
; no longer be made to hit its own allocation ceiling mid-request, so the
; longjmp path that leaves request memory invalid is not reachable via memory
; pressure.
;
; TRADEOFF — READ THIS BEFORE COPYING:
;   * -1 removes the memory ceiling ENTIRELY. A bug or a legitimate large
;     request can now consume all host memory instead of failing cleanly.
;   * The process MUST be bounded externally, e.g. systemd
;       MemoryMax=512M
;       MemoryHigh=384M
;     or a cgroup v2 memory.max on the FPM slice. Without that bound you have
;     traded an RCE primitive for a host-wide OOM/DoS.
;   * Prefer the bounded alternative where operationally possible:
;       php_admin_value[memory_limit] = 256M
;     with post_max_size at 8M (see section 6). 256M is ~32x post_max_size,
;     comfortably above the official "memory_limit >= ~4x post_max_size"
;     guidance, and keeps a ceiling.
;   * Use -1 only on high-risk, memory-bounded hosts (mod_php/prefork edge
;     boxes, containers with a hard cgroup limit).
;
; Whichever you choose, memory_limit must be LARGER than post_max_size. A
; memory_limit at or below post_max_size is the exploit's precondition.
php_admin_value[memory_limit] = -1


; -----------------------------------------------------------------------------
; 2. session.upload_progress.enabled = 0 (CVE-2026-109618 / 109619)
; -----------------------------------------------------------------------------
; OFFICIAL RATIONALE: the session upload-progress feature is the entry point
; for the demonstrated chains. It runs during request initialization, before
; the application and before normal session init (no session_start() needed),
; and it is ON by default in php.ini-production. Turning it off:
;   * closes the session-file injection path (attacker-controlled filename
;     written into sess_* -> Chain A),
;   * closes the handler-mismatch path (Chain C),
;   * removes the pre-RINIT consumer used by the validated FPM variant of
;     CVE-2026-109619 (session upload progress reaches session handling before
;     normal session init).
;
; This is NOT a complete fix: the multipart parser still runs for every
; multipart request (CVE-2026-109619), and the var_destroy UAF (Chain B) is
; independent of upload progress. It is still the single highest-value
; session setting.
;
; SIDE EFFECT: native PHP upload-progress bars stop working. Applications that
; implement their own progress endpoint are unaffected.
;
; php_admin_flag is the correct directive for a boolean INI. (php_admin_value
; with 0 also works but stores the string "0"; prefer the flag.)
php_admin_flag[session.upload_progress.enabled] = off


; -----------------------------------------------------------------------------
; 3. session.use_strict_mode = 1 (CVE-2026-109618)
; -----------------------------------------------------------------------------
; OFFICIAL RATIONALE: strict mode makes PHP reject a session ID it did not
; generate. The exploit's first primitive is session fixation via a PHPSESSID
; form field, which lets the attacker choose the session file name/path
; (sess_<id>). Strict mode turns that into a new, server-generated ID.
;
; This also blocks the "reuse the same SID against another vhost/handler"
; step in Chain C. Keep it on even after patching: it is cheap and has no
; legitimate downside for cookie-based sessions.
php_admin_flag[session.use_strict_mode] = on

; Belt-and-braces: never accept a session ID from the URL/POST at all.
; This is the direct control for the PHPSESSID-as-form-field primitive.
php_admin_flag[session.use_only_cookies] = on

; Optional but recommended: keep session cookies out of JavaScript and
; cross-site requests. These do not stop the core bug; they reduce the
; session-theft blast radius.
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Lax


; -----------------------------------------------------------------------------
; 4. session.serialize_handler = php_serialize (CVE-2026-109619 / Chain C)
; -----------------------------------------------------------------------------
; OFFICIAL RATIONALE: the legacy "php" handler uses a different on-disk format
; from php_serialize. When two pools/vhosts (or two requests on the same FPM
; worker, via the known serializer leak) disagree about the handler, one side
; can decode bytes written by the other, and the pipe-delimited "php" decoder
; will deserialize an injected object (Chain C). A single consistent handler
; removes that ambiguity.
;
; MANDATORY: set the SAME handler in every pool, every vhost, every CLI/cron
; context that touches the same session store. One legacy pool re-introduces
; the mismatch.
;
; Do NOT choose "php" or "php_binary" here; php_serialize is the safe,
; self-describing format.
php_admin_value[session.serialize_handler] = php_serialize


; -----------------------------------------------------------------------------
; 5. session.save_path — documented, isolated, non-executable
; -----------------------------------------------------------------------------
; WHY EXPLICIT: the default save_path is often shared by every pool and every
; vhost on the host. Chain C depends on writing a session in one security
; context and reading it in another. A per-pool directory:
;   * prevents cross-vhost session-file reuse,
;   * lets you mount the directory noexec, nosuid, nodev,
;   * lets you audit exactly which files the web user can create.
;
; SETUP (run once, as root):
;   install -d -o www-data -g www-data -m 0700 /var/lib/php/sessions/php2shell
;   # or, if several pools must share it, use 1733 (sticky) instead of 0700
;
; REQUIREMENTS:
;   * NOT under any DocumentRoot (an LFI must not be able to include it
;     directly; Chain A relies on an app-level LFI, do not hand it one).
;   * Mounted noexec,nosuid,nodev where possible.
;   * Owned by the pool user, mode 0700 (single pool) or 1733 (shared).
;   * Excluded from backups that leave the host unencrypted.
;
; Adjust the path to your distro layout (Debian/Ubuntu: /var/lib/php/sessions;
; RHEL: /var/lib/php/session). Create the directory BEFORE reloading, or FPM
; workers will fail to start sessions.
php_admin_value[session.save_path] = /var/lib/php/sessions/php2shell


; -----------------------------------------------------------------------------
; 6. Body-size relationship: keep post_max_size small
; -----------------------------------------------------------------------------
; OFFICIAL GUIDANCE: keep post_max_size low; the official OOM shapes keep the
; request under post_max_size while exhausting memory_limit. Lowering
; post_max_size shrinks the attacker's budget and is a verified control
; (a 1M post_max_size rejects the pressure bodies used by the public tooling).
;
; Relationship to memory_limit:
;   post_max_size  <= memory_limit / 4     (official rule of thumb)
;   8M  post_max_size  -> >= 32M memory_limit (or -1, cgroup-bounded)
;   32M post_max_size  -> >= 128M memory_limit (only if large uploads needed)
;
; If the application does not accept uploads, 8M is generous; 1M-2M is better.
; This does not fix the parser, but it makes the OOM shapes much harder to
; reach with the public tooling.
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 8M

; Cap the number of file parts. The ARM stage uses ~20 file parts with huge
; filenames; the RCE spray uses ~149-600 parts. A legitimate form rarely needs
; more than 20.
php_admin_value[max_file_uploads] = 20

; Keep the input parser's nesting bound tight (default 64). Deep field names
; are an official OOM shape; lowering this reduces the allocation multiplier.
php_admin_value[max_input_nesting_level] = 32


; -----------------------------------------------------------------------------
; 7. fatal_error_backtraces = 0 — PHP 8.5 ONLY (CVE-2026-109619)
; -----------------------------------------------------------------------------
; OFFICIAL RATIONALE: on PHP 8.5, fatal_error_backtraces is the strongest
; demonstrated PRODUCER of the stale worker-global state that the next request
; consumes ("basis of the confirmed mod_php exploitation"). A fatal error
; captures backtrace state that can outlive the request; the following request
; on the same worker can touch it before normal initialization.
;
; Setting it to 0 removes that producer. It does not remove the other
; producers (OOM, max_execution_time, parse/require failure), so it is one
; layer, not the fix.
;
; VERSION NOTE: this INI exists in PHP 8.5. On 8.4 and older, remove this line
; (FPM logs an "unknown setting" warning; harmless but noisy).
php_admin_flag[fatal_error_backtraces] = 0


; -----------------------------------------------------------------------------
; 8. Worker restart — MANDATORY, and a FULL restart
; -----------------------------------------------------------------------------
; Both CVEs are about state that lives in a WORKER PROCESS. Changing ini and
; reloading is not enough if old workers keep serving: the stale serialize/
; unserialize context or the stale global from before the change is still in
; their address space, and a request can consume it.
;
; DO THIS, in order:
;
;   # 1. Validate the pool config syntax before touching the running service
;   php-fpm8.5 -tt            # Debian/Ubuntu (binary name varies: php-fpm)
;   php-fpm -tt
;
;   # 2. FULL restart, not reload. `systemctl reload php8.5-fpm` performs a
;   #    graceful reload; it can leave old workers alive to finish requests.
;   systemctl restart php8.5-fpm
;   #    RHEL: systemctl restart php-fpm
;
;   # 3. Prove every worker was replaced: all start times must be AFTER the
;   #    restart, and the pool's master PID must be new.
;   systemctl status php8.5-fpm --no-pager
;   ps -eo pid,lstart,cmd | grep '[p]hp-fpm: pool'
;
;   # 4. Confirm the settings actually took effect (from the pool's user):
;   sudo -u www-data php-fpm8.5 -i 2>/dev/null | grep -E \
;     'session.upload_progress.enabled|session.use_strict_mode|session.serialize_handler|memory_limit'
;   # (or a phpinfo() page on a host you control, then delete it)
;
;   # 5. If you use Apache mod_php anywhere, restart Apache fully too:
;   systemctl restart apache2     # NOT `apachectl graceful`
;
; Related lifecycle guidance: set a finite pm.max_requests (e.g. 500) so
; workers are recycled regularly. This limits how long stale state can live,
; but it is NOT a substitute for the restart above — a worker that is already
; poisoned will keep serving until it is replaced.
;
; CONTAINERS/KUBERNETES: rolling-restart the pod/deployment. Do not assume a
; config reload or a new ReplicaSet revision recycles existing workers.
; =============================================================================