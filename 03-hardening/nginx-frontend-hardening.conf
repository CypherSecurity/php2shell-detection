# =============================================================================
# php2shell — nginx front-end hardening
# CVE-2026-109618 (OOM-corruption RCE) / CVE-2026-109619 (stale-global-state RCE)
# Advisory: PHP 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 release, 2026-10-21 14:00 UTC
#           GHSA-w8hw-w9fx-j79w (109618), GHSA-6wmf-4rv5-p3rp (109619)
# =============================================================================
#
# CONTEXT: include this file at the http{} level:
#
#     # /etc/nginx/nginx.conf
#     http {
#         include /etc/nginx/conf.d/php2shell-hardening.conf;
#         ...
#     }
#
# map{} / limit_*_zone / log_format are http-context-only and are active as
# written. The server{} example further down is COMMENTED OUT so this file
# parses cleanly on its own — copy the relevant lines into each PHP-serving
# server/location block.
#
# WHY THE EDGE MATTERS: PHP parses multipart/form-data during request
# initialization, BEFORE application code runs. A check that runs after PHP has
# consumed the body is too late for the official OOM shapes. nginx can reject
# the request before it reaches the FPM socket.
#
# These are compensating controls. Patch PHP; do not treat this as a fix.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Request classification maps
# -----------------------------------------------------------------------------
# Only multipart/form-data, not multipart/mixed or multipart/related. The
# official trigger is the form-data parser in main/rfc1867.c.
map $http_content_type $php2shell_is_multipart {
    default                 0;
    ~*^multipart/form-data  1;
}

# Any multipart subtype — used only by the emergency full block below.
map $http_content_type $php2shell_is_any_multipart {
    default        0;
    ~*multipart    1;
}

map $http_transfer_encoding $php2shell_is_chunked {
    default     0;
    ~*chunked   1;
}

# 1 = a Content-Length header was supplied, 0 = absent/empty.
# An empty value is treated the same as absent: PHP cannot use it for the
# post_max_size pre-check either.
map $http_content_length $php2shell_has_content_length {
    default  1;
    ""       0;
}

# -----------------------------------------------------------------------------
# 2. NEW SHAPE: chunked multipart with no Content-Length
# -----------------------------------------------------------------------------
# OFFICIAL OOM SHAPE #1: a multipart POST with Transfer-Encoding: chunked and
# no usable Content-Length passes the initial post_max_size check and keeps
# supplying decoded body data until memory_limit is exhausted. PHP's longjmp()
# OOM path then leaves request memory invalid (CVE-2026-109618).
#
# Fires only for the exact combination: multipart AND chunked AND no
# Content-Length. This is narrower than "reject all chunked requests", which
# would break legitimate streamed APIs.
map "$php2shell_is_multipart:$php2shell_is_chunked:$php2shell_has_content_length" $php2shell_block_chunked_multipart {
    default  0;
    "1:1:0"  1;
}

# -----------------------------------------------------------------------------
# 3. EMERGENCY BRAKE: block ALL multipart at the edge
# -----------------------------------------------------------------------------
# The Flare-style production brake: reject every multipart request before it
# reaches PHP. It is the only edge control that also covers OOM shapes that do
# not use chunked encoding (header floods, empty file controls, deep nesting).
#
# IT BREAKS ALL FILE UPLOADS. Enable it only on assets that do not accept
# uploads, and only until the patched PHP release is deployed.
#
# The map itself is always defined (cheap); the return 403 is what you enable
# in the server block, so it can be toggled per-vhost with one `if`.
map $php2shell_is_any_multipart $php2shell_block_all_multipart {
    default  0;
    "1"      1;
}

# -----------------------------------------------------------------------------
# 4. Rate limiting for .php endpoints
# -----------------------------------------------------------------------------
# The public tooling uses an ~8-attempt / ~25-second retry envelope, and the
# memory-corruption chain needs back-to-back requests on the SAME worker.
# Per-IP request-rate limiting does not stop a distributed or slow attacker,
# but it raises the cost and cuts opportunistic scanning.
#
# TUNE: 30r/m is deliberately conservative and WILL throttle busy apps/APIs.
# Start at 120r/m, watch the 429 rate, then tighten. Key by $binary_remote_addr;
# behind a CDN, key on the real-client-IP variable instead, or every request
# shares the CDN's address.
limit_req_zone  $binary_remote_addr zone=php2shell_php:10m  rate=30r/m;
limit_conn_zone $binary_remote_addr zone=php2shell_conn:10m;

limit_req_status  429;
limit_conn_status 429;

# Optional: keep a body-aware access log for triage. `$request_body` is only
# populated when a body was buffered; do not log it on high-volume vhosts.
# log_format php2shell_trace '$remote_addr "$request" $status '
#                            'len=$request_length ct="$http_content_type" '
#                            'cl="$http_content_length" rt=$request_time';
# access_log /var/log/nginx/php2shell_trace.log php2shell_trace;


# =============================================================================
# SERVER / LOCATION EXAMPLE — copy into each PHP-serving server block
# =============================================================================
# server {
#     listen 443 ssl;
#     server_name www.example.com;
#     root /var/www/html;
#
#     # ---------------------------------------------------------------------
#     # 4a. Chunked multipart + no Content-Length -> reject at the edge.
#     #     `if` is safe here because the only directive is `return`.
#     #
#     #     403 is the documented response. Some operators prefer 444
#     #     (close without response): a 403 can be routed through
#     #     `error_page 403 /handle.php`, and that PHP endpoint would parse a
#     #     multipart body. If you have such an error_page, use 444.
#     # ---------------------------------------------------------------------
#     if ($php2shell_block_chunked_multipart) {
#         return 403;
#     }
#
#     # ---------------------------------------------------------------------
#     # 4b. EMERGENCY ONLY: block every multipart request. Uncomment on
#     #     static/no-upload vhosts. This breaks legitimate file uploads.
#     # ---------------------------------------------------------------------
#     # if ($php2shell_block_all_multipart) {
#     #     return 403;
#     # }
#
#     # ---------------------------------------------------------------------
#     # 4c. client_max_body_size vs PHP's limits
#     # ---------------------------------------------------------------------
#     # Keep POST bodies small. nginx rejects bodies above this with 413 before
#     # PHP sees them, which is exactly the budget the official OOM shapes try
#     # to stay under.
#     #
#     #   8m  — default for a typical site
#     #   32m — only if the app genuinely accepts large uploads
#     #   1m  — no-upload sites (pair with 4b)
#     #
#     # RELATIONSHIP TO PHP:
#     #   post_max_size  <= client_max_body_size   (otherwise nginx is looser
#     #                                             than PHP and 413s become
#     #                                             confusing app errors)
#     #   memory_limit   >= 4 * post_max_size      (official rule of thumb)
#     #   memory_limit   >  post_max_size          (MANDATORY: a limit at or
#     #                                             below post_max_size is the
#     #                                             exploit's precondition)
#     #
#     # Example: 8m edge / 8M post_max_size / 256M memory_limit.
#     # If PHP uses memory_limit=-1, the container/cgroup must bound it.
#     client_max_body_size 8m;
#
#     # Header-pressure ceilings (OOM shape 2 is a header flood inside a part;
#     # the outer request header budget still needs a cap).
#     client_header_buffer_size 4k;
#     large_client_header_buffers 4 8k;
#     client_body_timeout 10s;
#     client_header_timeout 10s;
#
#     # ---------------------------------------------------------------------
#     # 5. PHP location: rate limit + FastCGI parameter hygiene
#     # ---------------------------------------------------------------------
#     location ~ \.php$ {
#         limit_req  zone=php2shell_php burst=20 nodelay;
#         limit_conn php2shell_conn 20;
#
#         include fastcgi_params;
#         fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
#         fastcgi_pass unix:/run/php/php8.5-fpm.sock;
#
#         # ---------------------------------------------------------------
#         # FASTCGI PARAMETER HYGIENE — CVE-2026-109619
#         # ---------------------------------------------------------------
#         # The advisory's validated FPM producer/consumer path is: the front
#         # end passes PHP_VALUE / PHP_ADMIN_VALUE to FPM, FPM applies them
#         # BEFORE normal request initialization, and an invalid/deprecated
#         # setting raises an INI diagnostic that publishes stale worker-global
#         # state for the next request to consume. PHP_ADMIN_VALUE can also
#         # re-enable session.upload_progress.enabled and undo the pool
#         # hardening.
#         #
#         # RULE: do not send these parameters at all. Audit the whole config:
#         #
#         #   grep -RnE 'fastcgi_param[[:space:]]+PHP_(VALUE|ADMIN_VALUE)' \
#         #       /etc/nginx
#         #
#         # Remove every hit from fastcgi_params, fastcgi.conf, snippets/, and
#         # per-site includes. A common bad pattern is a legacy
#         # `fastcgi_param PHP_VALUE "auto_prepend_file=..."` line.
#         #
#         # If you cannot remove a line because it comes from a vendor include,
#         # override it with an empty value. FPM treats an empty PHP_VALUE /
#         # PHP_ADMIN_VALUE as "no directives". This is weaker than omission
#         # (the parameter is still sent), so prefer deletion.
#         fastcgi_param PHP_VALUE "";
#         fastcgi_param PHP_ADMIN_VALUE "";
#
#         # Unrelated but standard hygiene: strip the Proxy header so httpoxy
#         # cannot influence outbound requests made by PHP.
#         fastcgi_param HTTP_PROXY "";
#     }
#
#     # ---------------------------------------------------------------------
#     # 6. Never execute PHP inside writable/upload directories
#     # ---------------------------------------------------------------------
#     # Post-exploitation drop locations, and where an upload primitive would
#     # try to land a webshell. This is permanent hardening, not php2shell-only.
#     location ~* ^/(uploads|wp-content/uploads|sites/default/files|media)/.*\.(php[0-9]?|phtml|phar|phps)$ {
#         return 403;
#     }
#
#     # ---------------------------------------------------------------------
#     # 7. Static assets never reach PHP
#     # ---------------------------------------------------------------------
#     location ~* \.(css|js|jpg|jpeg|png|gif|svg|woff2?|ttf|ico|map)$ {
#         try_files $uri =404;
#         # deliberately no fastcgi_pass
#     }
# }
#
# =============================================================================
# ROLLOUT NOTES
# =============================================================================
# 1. Validate before reload:
#        nginx -t
# 2. nginx reload replaces workers, but PHP-FPM workers are separate: a php.ini
#    or pool change requires a FULL FPM restart, and stale per-worker state
#    must be cleared. See fpm-pool-hardening.conf section 8.
# 3. Order of controls, cheapest first:
#      a. patch PHP (8.2.35 / 8.3.36 / 8.4.27 / 8.5.12)
#      b. pool hardening (session.upload_progress off, strict mode,
#         consistent serializer, memory bound)
#      c. chunked+multipart rejection at nginx (this file, 4a)
#      d. rate limiting (4/5)
#      e. emergency all-multipart block only on no-upload assets (4b)
# 4. The emergency block is not a substitute for the patch: it breaks uploads
#    and can be bypassed if there is another path to PHP (direct FPM port,
#    internal service, a second vhost without this include).
# 5. SAPI choice does not make FPM safe. The confirmed pre-init RCE path is
#    mod_php/prefork, but FPM remains susceptible post-startup (the validated
#    FPM chain uses an application-execution producer plus upload progress as
#    the consumer). Harden both.
# =============================================================================