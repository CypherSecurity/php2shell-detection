# =============================================================================
# php2shell — Apache + mod_php hardening
# CVE-2026-109618 (OOM-corruption RCE) / CVE-2026-109619 (stale-global-state RCE)
# Advisory: PHP 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 release, 2026-10-21 14:00 UTC
#           GHSA-w8hw-w9fx-j79w (109618), GHSA-6wmf-4rv5-p3rp (109619)
# =============================================================================
#
# mod_php + prefork is the HIGHEST-RISK SAPI for this vulnerability family and
# the officially confirmed HTTP exploitation path:
#
#   * mod_php invokes request shutdown UNCONDITIONALLY, even after a failed
#     request startup. The OOM path (CVE-2026-109618) therefore reaches request
#     shutdown with invalid request memory and executes the RCE primitive. FPM
#     exits the child on startup failure, so that exact chain does not survive
#     there; mod_php/prefork does.
#   * The confirmed producer for CVE-2026-109619 (fatal_error_backtraces on 8.5)
#     was demonstrated through mod_php, with per-directory INI diagnostics as a
#     consumer.
#
# If you can move PHP off mod_php to FPM, do that. If you cannot, apply every
# layer below AND patch immediately. These settings are compensating controls,
# not fixes.
#
# HOW TO APPLY
# ------------
# Save as /etc/apache2/conf-available/php2shell-hardening.conf (Debian/Ubuntu)
# or /etc/httpd/conf.d/php2shell-hardening.conf (RHEL), adjust the paths, then:
#
#   a2enconf php2shell-hardening      # Debian/Ubuntu
#   apachectl configtest              # MUST print "Syntax OK"
#   systemctl restart apache2         # full restart, NOT graceful
#
# One <Directory> block per DocumentRoot. The path below is a placeholder;
# duplicate the block for each vhost that serves PHP.
# =============================================================================


# -----------------------------------------------------------------------------
# 0. Only emit php_admin_* directives when mod_php is actually loaded.
#    On PHP 8 the module identifier is php_module; PHP 7 used php7_module.
# -----------------------------------------------------------------------------
<IfModule php_module>

    # -------------------------------------------------------------------------
    # 1. memory_limit — remove the controllable OOM failure (CVE-2026-109618)
    # -------------------------------------------------------------------------
    # OFFICIAL RATIONALE: the OOM triggers (chunked multipart without
    # Content-Length, part-header floods, empty file controls + deep nesting)
    # work by making an attacker-controlled allocation fail while the body
    # stays under post_max_size. PHP's longjmp() OOM path then leaves request
    # memory invalid; mod_php still runs request shutdown and reads it.
    #
    # -1 removes the failure point. TRADEOFF: it also removes the memory
    # ceiling entirely. mod_php/prefork has no per-worker memory cap of its own,
    # so you MUST bound each process externally:
    #
    #     systemd (Apache unit):
    #         MemoryMax=512M
    #         MemoryHigh=384M
    #     or a cgroup v2 memory.max on the Apache slice.
    #
    # Without that bound, -1 trades an RCE primitive for a host-wide OOM.
    #
    # Bounded alternative (preferred on shared hosts):
    #     php_admin_value memory_limit 256M
    # with post_max_size 8M. The official rule of thumb is memory_limit at
    # least ~4x post_max_size; 256M gives ~32x headroom and keeps a ceiling.
    #
    # Either way: memory_limit MUST be greater than post_max_size. A limit at
    # or below post_max_size is the exploit's precondition.
    php_admin_value memory_limit -1

    # -------------------------------------------------------------------------
    # 2. session.upload_progress.enabled = off (CVE-2026-109618 / 109619)
    # -------------------------------------------------------------------------
    # OFFICIAL RATIONALE: upload progress is parsed during request
    # initialization, before the application and before normal session init
    # (no session_start() required), and is enabled by default. Disabling it
    # closes the session-file injection chain (A), the handler-mismatch chain
    # (C), and the pre-RINIT consumer used by the validated FPM variant of
    # CVE-2026-109619.
    #
    # It does NOT fix the multipart parser itself, nor the var_destroy UAF
    # (Chain B). Side effect: native upload-progress bars stop working.
    php_admin_flag session.upload_progress.enabled off

    # -------------------------------------------------------------------------
    # 3. Session ID and serializer controls
    # -------------------------------------------------------------------------
    # Reject attacker-chosen session IDs. The exploit's first primitive is a
    # PHPSESSID *form field*, which bypasses session.use_only_cookies and lets
    # the attacker pick the session file name (sess_<id>).
    php_admin_flag session.use_strict_mode on
    php_admin_flag session.use_only_cookies on

    # One consistent on-disk format everywhere. The legacy "php" handler is
    # pipe-delimited and will deserialize an injected object; mixing it with
    # php_serialize (across vhosts, directories, or FPM requests) is Chain C.
    # Set the SAME value on every vhost and every other SAPI on this host.
    php_admin_value session.serialize_handler php_serialize

    # Per-vhost session directory: prevents cross-vhost session-file reuse
    # (Chain C depends on it) and allows noexec/nosuid/nodev mounting.
    # Create it first:
    #   install -d -o www-data -g www-data -m 0700 /var/lib/php/sessions/site-a
    # Never place it under a DocumentRoot, and never make it writable by other
    # users. Adjust the path per vhost.
    php_admin_value session.save_path /var/lib/php/sessions/site-a

    # -------------------------------------------------------------------------
    # 4. Body budgets — keep post_max_size small
    # -------------------------------------------------------------------------
    # OFFICIAL GUIDANCE: keep post_max_size low; every official OOM shape stays
    # under post_max_size while exhausting memory_limit. 8M is the sane default;
    # use 1M-2M on hosts that do not accept uploads at all.
    #
    # Relationship: post_max_size <= memory_limit / 4.
    php_admin_value post_max_size 8M
    php_admin_value upload_max_filesize 8M

    # The ARM stage uses ~20 file parts; the RCE spray uses 149-600. No normal
    # form needs more than 20.
    php_admin_value max_file_uploads 20

    # Deep field names are an official OOM shape; tighten the nesting bound.
    php_admin_value max_input_nesting_level 32

    # -------------------------------------------------------------------------
    # 5. fatal_error_backtraces = 0 — PHP 8.5 ONLY (CVE-2026-109619)
    # -------------------------------------------------------------------------
    # On 8.5 this is the strongest demonstrated PRODUCER of the stale
    # worker-global state that the next request consumes; the advisory calls it
    # the basis of the confirmed mod_php exploitation.
    #
    # REMOVE this line on PHP 8.4 and older (the INI does not exist there; the
    # directive is accepted but logs an unknown-setting warning).
    php_admin_flag fatal_error_backtraces off

    # -------------------------------------------------------------------------
    # 6. Do not raise diagnostics from per-directory INI
    # -------------------------------------------------------------------------
    # A confirmed consumer for CVE-2026-109619 is INI diagnostics raised before
    # request init — notably invalid or deprecated settings supplied per
    # directory (php_value in .htaccess / per-dir config). Consequences:
    #
    #   * Keep php_value / php_admin_value out of .htaccess entirely. Put
    #     settings here, in the vhost, where they are applied at startup.
    #   * Never put invalid, deprecated, or misspelled INI names in a
    #     per-directory block. A typo is not just noise: it raises the
    #     diagnostic that the exploit consumes.
    #   * Audit before deploying:
    #       grep -RnE 'php_(admin_)?(value|flag)' /var/www --include=.htaccess
    #     Expect no output.
    #
    # php_admin_* cannot be set from .htaccess at all (Apache rejects it), which
    # is another reason to use it here rather than php_value.

</IfModule>


# =============================================================================
# STATIC-ONLY VIRTUAL HOSTS — remove the PHP handler entirely
# =============================================================================
# A static vhost has no reason to execute PHP. If an upload or a misconfigured
# AddHandler drops a .php file there, "engine off" plus Require all denied
# makes it inert. This is the strongest per-vhost control available and costs
# nothing for genuinely static content.
#
# Adjust the path, and repeat per static vhost.
# =============================================================================
<Directory "/var/www/static">
    # 1. Turn the PHP engine off for this tree (defence in depth).
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>

    # 2. Remove handler/type mappings, in case a parent config added them.
    #    List every PHP-ish extension your build might map.
    RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phar .phps
    RemoveType    .php .phtml .php3 .php4 .php5 .php7 .php8 .phar .phps

    # 3. Refuse to serve the files at all, even as plain text. A .php file in
    #    a static tree is either a mistake or an upload; neither should be
    #    downloadable (source disclosure) or executable.
    <FilesMatch "\.(php[0-9]?|phtml|phar|phps)$">
        Require all denied
    </FilesMatch>

    # 4. Optional: cap request bodies at the Apache layer too.
    # LimitRequestBody 8388608
</Directory>


# =============================================================================
# EMERGENCY MULTIPART BLOCK (breaks all file uploads — use only as a brake)
# =============================================================================
# The block must happen BEFORE PHP sees the body: PHP parses multipart during
# request initialization, before any application code runs. Apache authz runs
# before the PHP handler, so this works for mod_php.
#
# ENABLE ONLY on vhosts that do not accept uploads. It rejects every
# multipart/form-data request, including legitimate ones, with 403.
#
# Uncomment inside the affected <VirtualHost>:
#
# <If "%{HTTP:Content-Type} =~ m#^multipart/form-data#i">
#     Require all denied
# </If>
#
# Note: this matches only multipart/form-data. The official OOM shape also
# includes multipart bodies sent with other methods (PHP 8.4
# request_parse_body supports PUT/PATCH/DELETE), which are covered by the same
# expression because it keys on Content-Type, not method.
#
# If you need uploads on the same host, do NOT enable this. Instead rely on
# the request-body limits above, the WAF rules in
# ../../../modsecurity/php2shell-v2.conf, and the patch.


# =============================================================================
# RESTART GUIDANCE — full restart, every worker
# =============================================================================
# mod_php keeps request-scoped state in each prefork CHILD. A graceful restart
# lets old children finish in-flight requests and can leave them serving; a
# child that was already poisoned (or that loaded the old INI) must be killed,
# not drained.
#
#   apachectl configtest                  # must print "Syntax OK"
#   systemctl restart apache2             # NOT `apachectl graceful`
#   # RHEL: systemctl restart httpd
#
# Verify every child is new:
#
#   systemctl status apache2 --no-pager
#   ps -eo pid,lstart,cmd | grep '[a]pache2'
#
# All child start times must be after the restart. If any predate it, the
# restart did not replace them (common with custom MPM scripts or a supervisor
# that restarts the master only).
#
# Also verify the settings are live on a host you control (then delete the
# page):
#
#   <?php phpinfo(INFO_GENERAL | INFO_CONFIGURATION); ?>
#
# Look for session.upload_progress.enabled = Off, session.use_strict_mode = On,
# session.serialize_handler = php_serialize, and the memory_limit you chose.
#
# CONTAINERS: restart the pod/deployment; a rolling update must replace every
# Apache child, not just the image tag.
# =============================================================================