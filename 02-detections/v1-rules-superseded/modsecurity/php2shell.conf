# ModSecurity / Coraza rules — php2shell (CVE-2026-109618 / CVE-2026-109619)
#
# Requires SecRequestBodyAccess On and the multipart parser enabled (defaults).
# Rule IDs use the 20261061xx range — renumber to your scheme.
# Default action is BLOCK. If you have apps using native PHP upload progress bars,
# switch rule 2026106101 to pass,log first and watch.

SecRequestBodyAccess On

# [1] PHP_SESSION_UPLOAD_PROGRESS field present in a multipart POST.
#     Every exploit chain (and any progress-bar app) hits this.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" \
  "id:2026106101,phase:2,deny,status:403,log,msg:'php2shell CVE-2026-109618/109619: PHP_SESSION_UPLOAD_PROGRESS field in multipart POST',tag:'CVE-2026-109618',tag:'CVE-2026-109619',t:none"
SecRule REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" \
  "id:2026106102,phase:2,deny,status:403,log,msg:'php2shell CVE-2026-109618: upload-progress trigger field in body',tag:'CVE-2026-109618',chain"
  SecRule REQUEST_METHOD "@streq POST" "t:none"

# [2] Session-fixation primitive: PHPSESSID supplied as a POST form field.
#     Bypasses session.use_only_cookies — no benign client does this.
SecRule ARGS:PHPSESSID "!@streq "" \
  "id:2026106103,phase:2,deny,status:403,log,msg:'php2shell CVE-2026-109618: PHPSESSID in request body (session fixation)',tag:'CVE-2026-109618'"

# [3] Payload smuggling in multipart filename: PHP open tags.
#     Near-zero false positives. Strongest single signal.
SecRule REQUEST_BODY "@rx filename\x3d\x22[^\x22\r\n]{0,256}(\x3c\x3fphp|\x3c\x3f=)" \
  "id:2026106104,phase:2,deny,status:403,log,msg:'php2shell CVE-2026-109618: PHP code in multipart filename',tag:'CVE-2026-109618',t:none"

# [4] Payload smuggling in multipart filename: serialized-object syntax
#     (pipe-delimited O:N:"..." objects or R:N; references — Chain C).
SecRule REQUEST_BODY "@rx filename\x3d\x22[^\x22\r\n]{0,256}(\|O:[0-9]+\x3a|R:[0-9]+;)" \
  "id:2026106105,phase:2,deny,status:403,log,msg:'php2shell CVE-2026-109618: serialized object payload in multipart filename',tag:'CVE-2026-109618',t:none"

# [5] Binary heap-spray blobs in non-file form fields (the RCE stage sprays
#     ~149 parts of 288-byte non-UTF-8 data). High-bytes ratio heuristic.
SecRule ARGS "@rx (?:[^\x00-\x7f]{32,})" \
  "id:2026106106,phase:2,deny,status:403,log,msg:'php2shell CVE-2026-109619: binary blob in multipart form field (heap spray)',tag:'CVE-2026-109619',t:none"

# [6] Parser-error side channel: repeated multipart parse failures from one
#     source in < 60s (PRIME stage fatals). Tune threshold to your traffic.
SecRule MULTIPART_ERROR "@eq 1" \
  "id:2026106107,phase:2,pass,log,msg:'php2shell: multipart parse error (possible PRIME stage)',tag:'CVE-2026-109619',setvar:ip.mpfails=+1,expirevar:ip.mpfails=60"
SecRule IP:MPFAILS "@gt 5" \
  "id:2026106108,phase:1,deny,status:403,log,msg:'php2shell: repeated multipart errors (memory-grooming pattern)',tag:'CVE-2026-109618'"

# =============================================================================
# Added 2026-10-21 after official advisories (GHSA-w8hw-w9fx-j79w) listed the
# three concrete OOM trigger shapes. Rules 2026106101-108 above do not cover them.
# =============================================================================

# [7] OOM strategy 1 (official): chunked multipart POST — no usable Content-Length,
#     bypasses the initial post_max_size check. (Some ModSecurity builds reject
#     chunked bodies outright; verify behavior on your version.)
SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)chunked" \
  "id:2026106109,phase:1,deny,status:403,log,msg:'php2shell CVE-2026-109618: chunked multipart POST (post_max_size bypass)',tag:'CVE-2026-109618',chain"
  SecRule REQUEST_HEADERS:Content-Type "@rx (?i)multipart/form-data" "t:none"

# [8] OOM strategy 2 (official): header flood inside a multipart part — part
#     headers cost far more memory in PHP than on the wire; exhausts memory_limit
#     while staying within post_max_size. 50+ consecutive header lines in a part
#     has no legitimate shape.
SecRule REQUEST_BODY "@rx (?:\r\n[A-Za-z0-9-]{1,50}\x3a\x20[^\r\n]{0,512}){50,}" \
  "id:2026106110,phase:2,deny,status:403,log,msg:'php2shell CVE-2026-109618: multipart part header flood (OOM strategy)',tag:'CVE-2026-109618',t:none"

# [9] OOM strategy 3 (official): empty file controls flood — filename="" parts
#     bypass max_file_uploads but still allocate metadata arrays.
SecRule REQUEST_BODY "@rx (?:filename\x3d\x22\x22[\s\S]{0,400}?){50,}" \
  "id:2026106111,phase:2,deny,status:403,log,msg:'php2shell CVE-2026-109618: empty file-control flood (max_file_uploads bypass)',tag:'CVE-2026-109618',t:none"

# [10] OOM strategy 3 variant (official): deeply nested field names near
#      max_input_nesting_level (default 64) — multiplies array allocation work.
SecRule REQUEST_BODY "@rx name\x3d\x22[^\x22]{0,64}(?:\x5b[^\x5d\x22]{0,32}\x5d){30,}\x22" \
  "id:2026106112,phase:2,deny,status:403,log,msg:'php2shell CVE-2026-109618: deeply nested multipart field names (OOM strategy)',tag:'CVE-2026-109618',t:none"
