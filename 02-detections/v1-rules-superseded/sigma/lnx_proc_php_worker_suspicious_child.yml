title: PHP Worker spawned a Shell, Interpreter or Downloader Process
id: 7c1f0a2e-9b3d-4e6a-b1c4-0f2d5a8e9c01
status: experimental
description: >
  Detects a PHP worker process (php-fpm, php, php-cgi, httpd/apache2 with mod_php)
  creating a child process that is a shell, script interpreter, or network/download
  tool. PHP has no benign reason to spawn these. This is the post-exploitation
  signal for PHP RCE such as php2shell (CVE-2026-109618 / CVE-2026-109619),
  and matches nearly every PHP intrusion (webshell, deserialization, UAF chains).
  If this fires, the box is likely already compromised — use for scoping, not prevention.
references:
  - https://sansec.io/research/php2shell
  - https://www.huntress.com/blog/php2shell-leaked-critical-php-vulnerabilities
author: detection engineering research
date: 2026/10/21
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent_img:
    ParentImage|endswith:
      - '/php-fpm'
      - '/php'
      - '/php-cgi'
      - '/httpd'
      - '/apache2'
  selection_parent_img_versioned:
    ParentImage|contains:
      - '/php-fpm7.'
      - '/php-fpm8.'
      - '/php7.'
      - '/php8.'
  selection_child_img:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/zsh'
      - '/ksh'
      - '/python'
      - '/python3'
      - '/perl'
      - '/ruby'
      - '/curl'
      - '/wget'
      - '/nc'
      - '/ncat'
      - '/netcat'
      - '/socat'
      - '/openssl'
      - '/php'          # php -r execution chains
  selection_cmdline_patterns:
    ParentCommandLine|contains:
      - 'php-fpm: pool'
    CommandLine|contains:
      - '/dev/tcp/'
      - '/dev/udp/'
      - 'mkfifo'
      - 'fsockopen'
      - 'bash -i'
      - 'sh -i'
      - 'base64 -d'
      - 'whoami; id'
      - 'uname -a'
  condition: (1 of selection_parent_*) and 1 of selection_child_img or selection_cmdline_patterns
falsepositives:
  - Poorly written cron jobs or monitoring scripts invoked from PHP applications
  - Applications that intentionally shell out (ImageMagick wrappers, PDF generators) — tune by child Image
level: critical
tags:
  - attack.execution
  - attack.t1059
  - attack.t1106
  - cve.2026-109618
  - cve.2026-109619
