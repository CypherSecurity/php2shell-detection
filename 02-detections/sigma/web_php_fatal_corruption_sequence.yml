title: php2shell Producer — Pre-Init Fatal in PHP Worker (correlation component)
name: php2shell_producer_preinit_fatal
id: 03194fe2-d898-450a-b2a1-f14f70ca57fd
status: experimental
description: >
  COMPONENT RULE for the php2shell producer/consumer correlation. Not intended
  for standalone paging — it is broad on purpose (any pre-init fatal can be the
  producer the advisories describe). Alert on the correlation rule, not on this
  component: a fatal alone is common, a fatal followed 60 s later by the stale
  session warning from the same worker is not.
  Lab-validated 2026-10-21: the ARM OOM carried the same pid as the following
  "Session ini settings cannot be changed" warning.
references:
  - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
  - https://www.php.net/archive/2026.php#2026-10-21
author: detection engineering research
date: 2026/10/21
logsource:
  category: webserver
detection:
  selection:
    message|contains:
      - 'PHP Fatal error'
      - 'PHP Parse error'
      - 'PHP Compile error'
      - 'Maximum execution time'
      - 'Uncaught Error'
      - 'Uncaught Exception'
      - 'Failed opening required'
  filter_noise:
    host|contains:
      - 'ci-'
      - 'staging-'
      - 'dev-'
  condition: selection and not filter_noise
fields:
  - message
  - pid
  - c-ip
level: informational
tags:
  - attack.execution
  - cve.2026-109618
  - cve.2026-109619
