title: php2shell Consumer — Stale Session INI Warning (correlation component)
name: php2shell_consumer_stale_session_ini
id: 505baa6f-18a7-4299-9d6c-206314ed759c
status: experimental
description: >
  COMPONENT RULE for the php2shell producer/consumer correlation. Matches the
  official CVE-2026-109619 consumer artifact — INI diagnostics raised before
  request init while stale worker-global session state is still active. Rare on
  healthy workers; keep at informational and rely on the correlation rule.
  Lab-validated 2026-10-21 (verbatim string, same pid as the preceding OOM).
references:
  - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
  - https://www.php.net/archive/2026.php#2026-10-21
author: detection engineering research
date: 2026/10/21
logsource:
  category: webserver
detection:
  selection:
    message|contains:
      - 'Session ini settings cannot be changed when a session is active'
  condition: selection
fields:
  - message
  - pid
  - c-ip
level: informational
tags:
  - attack.execution
  - cve.2026-109619
