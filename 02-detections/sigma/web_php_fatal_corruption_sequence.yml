title: php2shell Producer/Consumer Pair on Same Worker (fatal then stale-session warning)
id: c270c5ad-3f1e-41c6-b9d9-bc758a255a9d
status: experimental
description: >
  Temporal correlation: a pre-init PHP fatal (producer) followed within 60 s by
  "Session ini settings cannot be changed when a session is active" (consumer)
  on the same worker pid and, where available, the same client IP. This is the
  cross-request stale-state pattern officially described for CVE-2026-109619
  and reproduced in the 2026-10-21 validation lab. Requires log events to be
  parsed into `pid` and `c-ip` fields; if only raw text exists, extract pid via
  \[pid (\d+)(?::tid \d+)?\] before applying. Backends without Sigma correlation
  support: use the Splunk (hunting-queries-v2.md §1.5), Elastic EQL (§2.2) or
  Defender KQL (§3.1) equivalents.
references:
  - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
  - https://www.php.net/archive/2026.php#2026-10-21
author: detection engineering research
date: 2026/10/21
correlation:
  type: temporal
  rules:
    - php2shell_producer_preinit_fatal
    - php2shell_consumer_stale_session_ini
  group-by:
    - pid
    - c-ip
  timespan: 60s
  generate: false
level: critical
tags:
  - attack.execution
  - attack.t1190
  - cve.2026-109618
  - cve.2026-109619