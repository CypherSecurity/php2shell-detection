title: Session File Written by Web Pool User with Anomalous Size (php2shell sess_* payload write)
id: 64675d34-88ca-473f-8e5a-1138e770a14e
status: experimental
description: >
  Detects a session file (sess_*) created or modified under a PHP session
  save_path by the web pool user (www-data / apache / nginx / php-fpm) at a size
  never produced by normal session payloads. Normal PHP sessions are tens to a
  few hundred bytes (upload_progress entries can reach a few KB); php2shell
  PRIME/LEAK sessions are multi-MB, and the LEAK stage writes heap-address
  strings into the file. This rule supplies the file-path/size stream; the
  CONTENT verdict (PHP tags, serialized objects, pointer-like hex) belongs to
  the companion YARA rules `Webshell_In_Session_File` and
  `Session_Serialize_Mismatch_Residue` in ../yara/php2shell.yar, run over
  sess_* files found under the save path (that file's `Oversized_Session_File`
  rule uses a 512 KB threshold and needs the `find -name 'sess_*'` wrapper
  documented there). Pair: YARA hit = confirmed Chain A/C payload; this rule
  alone = suspicious size only.

  Backend note: `file.size|gte` requires a file_event source that reports size
  (auditd PATH records with nametype=CREATE do not; Sysmon-for-Linux does not;
  Elastic Malware/Filebeat, osquery file events, fanotify/eBPF sensors do).
  If your backend has no size, drop the size selection and rely on the YARA
  file scan plus the hunting query in hunting-queries-v2.md §5.
  Session path list below is the Debian/Ubuntu/RHEL default set — add your
  configured session.save_path.
references:
  - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
  - https://github.com/ikow/php2shell-poc
  - https://sansec.io/research/php2shell
author: detection engineering research
date: 2026/10/21
logsource:
  category: file_event
  product: linux
detection:
  selection_session_path:
    TargetFilename|startswith:
      - '/var/lib/php/sessions/'
      - '/var/lib/php/session/'
      - '/var/lib/php5/'
      - '/var/lib/php/'
      - '/run/php/sessions/'
      - '/tmp/sess_'
  selection_session_name:
    TargetFilename|re: '/sess_[^/]+$'
  selection_pool_writer:
    User:
      - 'www-data'
      - 'apache'
      - 'nginx'
      - 'php-fpm'
  selection_large:
    file.size|gte: 102400
  condition: selection_session_path and selection_session_name and selection_pool_writer and selection_large
fields:
  - TargetFilename
  - User
  - Image
  - file.size
falsepositives:
  - Applications that legitimately store large blobs in $_SESSION (cart
    snapshots, cached API responses, uploaded-document state) — baseline max
    session size per vhost before alerting.
  - "upload_progress sessions for genuinely large uploads — size tracks the
    in-flight upload metadata and can reach hundreds of KB; correlate with the
    app's real upload endpoints."
level: high
tags:
  - attack.persistence
  - attack.t1505.003
  - cve.2026-109618
  - cve.2026-109619
---
title: Session Save Path Written by a Non-Pool Process (php2shell session tampering / auditd)
id: d6cb2f28-85cc-46c0-ba48-1a6263a62b98
status: experimental
description: >
  Detects any process OTHER than the expected web pool user/writer touching a
  PHP session file or the session save_path directory. Normal traffic to
  /var/lib/php/sessions is exclusively php-fpm/httpd workers running as the pool
  user. A shell, cron job, backup agent, attacker tool, or a second service
  writing there is either session tampering (planting a serialized object /
  PHP-tag sess_ file for Chain A/C) or staging/exfiltration of session contents.

  Lab-validated 2026-10-21 context: the dangling PS(save_path) corruption makes
  PHP itself attempt writes to a garbage path whose prefix is still the session
  dir — those come from the pool user and are covered by the previous rule, not
  this one. This rule is the "someone else is in the session store" signal.

  auditd mapping: if you ingest auditd SYSCALL/PATH records instead of a
  file_event category, use type=SYSCALL with
  `name`/`path` matching the session dir, `nametype` in (CREATE, NORMAL,
  DELETE), and filter `auid`/`uid` of the pool user; the `exe` field is the
  equivalent of Image and `comm` disambiguates php-fpm from a shell. Elastic
  auditd manager / Filebeat auditd module field names: file.path, user.name,
  process.executable.
references:
  - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
  - https://sansec.io/research/php2shell
author: detection engineering research
date: 2026/10/21
logsource:
  category: file_event
  product: linux
detection:
  selection_session_path:
    TargetFilename|startswith:
      - '/var/lib/php/sessions/'
      - '/var/lib/php/session/'
      - '/var/lib/php5/'
      - '/run/php/sessions/'
  filter_expected_writers:
    Image|endswith:
      - '/php-fpm'
      - '/php'
      - '/php-cgi'
      - '/apache2'
      - '/httpd'
      - '/nginx'
  filter_expected_users:
    User:
      - 'www-data'
      - 'apache'
      - 'nginx'
      - 'php-fpm'
  filter_maintenance:
    # Tune: distro session GC cron (`php /usr/lib/php/sessionclean`) runs as root
    # and is expected. Keep the allow-list as narrow as possible.
    CommandLine|contains:
      - 'sessionclean'
      - 'php session gc'
  condition: selection_session_path and not filter_expected_writers and not filter_expected_users and not filter_maintenance
fields:
  - TargetFilename
  - Image
  - CommandLine
  - User
falsepositives:
  - Backup/AV/indexing agents that read (and occasionally touch) the session
    directory — scope by Image rather than disabling the rule.
  - Distro session garbage collection and admin maintenance scripts — add
    narrowly to filter_maintenance.
  - Container runtimes/overlayfs presenting host paths differently — verify the
    path seen by the sensor before tuning.
level: high
tags:
  - attack.persistence
  - attack.t1505.003
  - attack.t1070
  - cve.2026-109618
  - cve.2026-109619