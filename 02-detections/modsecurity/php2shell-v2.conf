# =============================================================================
# php2shell v2 — ModSecurity / Coraza rules
# CVE-2026-109618 (OOM-corruption RCE) + CVE-2026-109619 (stale-global-state RCE)
# =============================================================================
#
# WHAT THIS FILE ADDS OVER detections/modsecurity/php2shell.conf
# ---------------------------------------------------------------
# The original rules (IDs 2026106101-2026106112) cover the exploit's session
# artifacts: PHP_SESSION_UPLOAD_PROGRESS in a multipart body, PHPSESSID as a
# form field, PHP/serialized payloads in filename=, heap-spray blobs, and the
# three pre-release OOM shapes.
#
# This file covers the NEW official shapes and parser pressures disclosed with
# the 2026-10-21 advisories (GHSA-w8hw-w9fx-j79w / GHSA-6wmf-4rv5-p3rp):
#
#   2026106201  chunked multipart with no Content-Length  (OOM shape #1)
#   2026106202  multipart PUT/PATCH/DELETE                (PHP 8.4 request_parse_body)
#   2026106203  part-header flood, body approximation     (OOM shape #2 variant)
#   2026106204  deeply nested multipart field names       (OOM shape #3 variant)
#   2026106205  giant filename (>= 64 KiB)                (ARM stage)
#
#   2026106211-215  detect-only (phase:5 / LOGGING) canaries mirroring 201-205
#
# DELIBERATELY NOT RESTATED HERE: session fixation via a PHPSESSID form field.
# v1 rule 2026106103 already covers it with a better-targeted match, and a
# second copy would only add alert noise. Same for the spray/filename-payload
# rules 2026106104-106. Load v1 + v2 together.
#
# IDs intentionally stay inside 20261062xx and do NOT reuse 2026106101-112, so
# this file can be included alongside the original package (and alongside
# handoff variants that already claimed 2026106108-112).
#
# REQUIREMENTS
# ------------
#   * ModSecurity v2 (Apache/nginx connector) or Coraza with the same syntax.
#   * SecRequestBodyAccess On — without it REQUEST_BODY is empty and the
#     phase:2 rules silently never match. Header rules still work.
#   * The multipart parser enabled (default). Some ModSecurity builds reject
#     chunked bodies before phase:1; verify on your version.
#   * CRS users: CRS may already deny PUT/DELETE or oversized bodies with its
#     own IDs. These rules are additive, not replacements.
#
# ORDERING
# --------
# Phase:1 rules are header-only and run before the body is read. Phase:2 rules
# inspect the buffered body. The canary block at the bottom is phase:5 and is
# meant for tuning, not for production enforcement.
#
# DEFAULT ACTION: deny/403 for 201-205. Every rule is individually tunable;
# see "TUNING" at the bottom for how to downgrade one rule or run the whole
# file in detect-only mode.
# =============================================================================

SecRequestBodyAccess On

# Optional, but recommended: cap the body ABOVE what you need, not at the
# default 12.5 MB, and keep post_max_size at/below this value in php.ini.
#   SecRequestBodyLimit 13107200
#   SecRequestBodyInMemoryLimit 131072
# Giant-filename rule 2026106205 needs at least 64 KiB of retained body, which
# the default already provides. Raising SecRequestBodyLimit to multi-megabyte
# values increases WAF memory pressure — that is the resource the exploit is
# trying to exhaust.

# -----------------------------------------------------------------------------
# [201] OOM shape #1 (official): chunked multipart without Content-Length.
#
# The advisory's first trigger shape: a multipart POST with
# Transfer-Encoding: chunked and no usable Content-Length skips the initial
# post_max_size check while continuing to supply decoded body data. PHP keeps
# allocating until memory_limit is hit; the failed allocation longjmps and
# leaves request memory invalid (CVE-2026-109618).
#
# This MUST be phase:1: it is a header-only decision, and running it in phase:2
# would require accepting/buffering the very body we are trying to reject.
#
# &REQUEST_HEADERS:Content-Length counts the header occurrences; "@eq 0"
# means absent. (A bare REQUEST_HEADERS:Content-Length test does not fire when
# the header is missing, which is exactly the case we need.)
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" \
    "id:2026106201,phase:1,deny,status:403,log,chain,\
     msg:'php2shell CVE-2026-109618: chunked multipart with no Content-Length (OOM shape 1)',\
     tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',tag:'oom',\
     severity:'CRITICAL',t:none"
    SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)chunked" "t:none,chain"
        SecRule &REQUEST_HEADERS:Content-Length "@eq 0" "t:none"

# NOTE / LIMITATION: HTTP/2 has no Transfer-Encoding header, so this rule does
# not fire for an h2 request with no content-length. If your front end forwards
# h2 to ModSecurity, add a companion rule keyed on REQUEST_PROTOCOL and test it
# against legitimate browser uploads first:
#   SecRule REQUEST_PROTOCOL "@rx ^HTTP/2" "id:2026106299,phase:1,pass,log,\
#     chain,msg:'php2shell h2 multipart without content-length (canary)',\
#     tag:'php2shell',tag:'canary'"
#     SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" "chain,t:none"
#       SecRule &REQUEST_HEADERS:Content-Length "@eq 0" "t:none"

# -----------------------------------------------------------------------------
# [202] Multipart PUT / PATCH / DELETE.
#
# PHP 8.4 added request_parse_body(), which parses multipart bodies for methods
# other than POST. Those code paths reach the same vulnerable request-init
# parser, so blocking only POST multipart leaves a method-confusion gap.
#
# BREAKING CHANGE: some REST APIs legitimately send multipart PUT/PATCH
# (file replacement, JSON-patch-as-form). This rule WILL break them. If you
# have such an API, exclude its path with a SecRuleUpdateTargetById/ctl
# exception, or downgrade this rule to pass+log (see TUNING).
# -----------------------------------------------------------------------------
SecRule REQUEST_METHOD "@rx ^(PUT|PATCH|DELETE)$" \
    "id:2026106202,phase:1,deny,status:403,log,chain,\
     msg:'php2shell CVE-2026-109619: multipart %{REQUEST_METHOD} (request_parse_body path)',\
     tag:'CVE-2026-109619',tag:'php2shell',tag:'parser',\
     severity:'CRITICAL',t:none"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" "t:none"

# -----------------------------------------------------------------------------
# [203] Part-header flood — body-based approximation.
#
# Official OOM shape #2: part headers cost far more memory in PHP than on the
# wire, so a part with a very large number of header lines exhausts memory_limit
# while the body stays under post_max_size.
#
# LIMITATION: ModSecurity normalises the part headers it parses and does not
# expose a reliable per-part header-count variable (and MULTIPART_PART_HEADERS
# is not populated consistently across connectors/versions). REQUEST_HEADERS_NAMES
# only sees the OUTER request's headers — never the headers inside a multipart
# part. So this is a raw-body heuristic: 40+ X-* header lines in one body.
#
# The X- prefix is deliberate: ordinary multipart parts carry a handful of
# Content-* headers per part, while a flood is attacker-shaped and usually
# repeats a custom header. Attackers can evade by not using X- names; pair this
# with the generic flood rule in the original conf (ID 2026106110, 50+
# consecutive header lines) and with a body-size / part-count budget.
# -----------------------------------------------------------------------------
SecRule REQUEST_BODY "@rx (?:\r\nX-[A-Za-z0-9-]{1,64}\x3a[^\r\n]*){40,}" \
    "id:2026106203,phase:2,deny,status:403,log,\
     msg:'php2shell CVE-2026-109618: multipart part-header flood (40+ X- headers, OOM shape 2)',\
     tag:'CVE-2026-109618',tag:'php2shell',tag:'oom',\
     severity:'CRITICAL',t:none"

# -----------------------------------------------------------------------------
# [204] Deeply nested field names.
#
# Official OOM shape #3 includes field names nested near max_input_nesting_level
# (default 64); each level multiplies array-allocation work during request init.
# A single name with 5+ bracket levels is already unusual; ten such names in one
# body is an allocation-pressure pattern.
#
# The regex says: ten (or more) occurrences of a name="..." attribute whose
# value has 5+ [..] levels, allowing up to 200 bytes between names. This is an
# approximation — PCRE cannot count nested depth, only bracket groups — and it
# is deliberately bounded to limit backtracking.
#
# PERFORMANCE: this is the most expensive rule in the file. If you see PCRE
# match-limit warnings, raise SecPcreMatchLimit or downgrade to the canary.
# -----------------------------------------------------------------------------
SecRule REQUEST_BODY "@rx (name\x3d\x22[^\x22\r\n]{0,100}(\[[^\[\]\x22\r\n]{1,32}\]){5,}\x22[\s\S]{0,200}?){10,}" \
    "id:2026106204,phase:2,deny,status:403,log,\
     msg:'php2shell CVE-2026-109618: 10+ deeply nested multipart field names (OOM shape 3)',\
     tag:'CVE-2026-109618',tag:'php2shell',tag:'oom',\
     severity:'CRITICAL',t:none"

# Optional cheaper companion (single field, 8+ levels). Useful when the full
# 10x rule is too slow for your traffic profile:
#   SecRule REQUEST_BODY "@rx name\x3d\x22[^\x22\r\n]{0,64}(\[[^\[\]\x22\r\n]{1,32}\]){8,}\x22" \
#     "id:2026106206,phase:2,deny,status:403,log,\
#      msg:'php2shell: field name with 8+ nesting levels',tag:'php2shell',t:none"

# -----------------------------------------------------------------------------
# [205] Giant filename (ARM stage).
#
# The public tooling sends 256 KB filenames (20 parts of 'N' bytes) and a
# 1.8 MB single-filename variant; the accepted reproducer uses a 1.3 MB
# filename. The vulnerability's filename length limit is effectively absent.
# 64 KiB is already far beyond any real filename and is the threshold used by
# the hunting queries in the original package.
#
# PCRE2's maximum quantifier is 65535, so "{65536,}" is a syntax error. The
# pattern below means "65535 non-quote bytes followed by at least one more",
# i.e. >= 65536 bytes, which is the exact advisory shape.
#
# LIMITATION: ModSecurity must retain the body for REQUEST_BODY inspection.
# With the default SecRequestBodyLimit (12.5 MB) a 1.8 MB filename is fine; if
# you lowered the limit below 64 KiB this rule can never fire. Some connectors
# truncate REQUEST_BODY at an embedded NUL or at in-memory limits — multipart
# filename bytes are text, so NUL truncation is not the usual failure mode, but
# verify with a lab request before relying on it.
# -----------------------------------------------------------------------------
SecRule REQUEST_BODY "@rx (?i)filename\x3d\x22[^\x22]{65535}[^\x22]" \
    "id:2026106205,phase:2,deny,status:403,log,\
     msg:'php2shell CVE-2026-109619: multipart filename >= 64 KiB (ARM stage)',\
     tag:'CVE-2026-109619',tag:'php2shell',tag:'arm',\
     severity:'CRITICAL',t:none"

# -----------------------------------------------------------------------------
# [Optional] Combined high-confidence shape: upload-progress field + huge body.
#
# The original rules already alert on PHP_SESSION_UPLOAD_PROGRESS and on the
# filename payload. If you need a single high-precision rule for ticket
# generation, this one combines the trigger field with a body above the usual
# post_max_size for small sites. Disabled by default — uncomment to use.
# -----------------------------------------------------------------------------
# SecRule REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" \
#     "id:2026106207,phase:2,deny,status:403,log,chain,\
#      msg:'php2shell: upload-progress trigger with oversized multipart body',\
#      tag:'CVE-2026-109618',tag:'php2shell',severity:'CRITICAL',t:none"
#     SecRule REQUEST_HEADERS:Content-Length "@gt 2097152" "t:none"

# =============================================================================
# DETECT-ONLY CANARY SET (phase:5 — LOGGING)
# =============================================================================
#
# These rules measure what an enforcement rule WOULD have blocked, after the
# request/response has completed, without changing the outcome. They log with
# `pass` and never deny.
#
# WHY PHASE 5 AND NOT PHASE 4:
#   ModSecurity phases are:
#       1 = request headers    2 = request body    3 = response headers
#       4 = response body      5 = logging
#   The package brief called this a "phase:4 logging" canary, but phase 4 is
#   RESPONSE_BODY. It does not execute when response-body inspection is
#   disabled (SecResponseBodyAccess Off — the default, and the only sane
#   setting for most deployments because it buffers every response). A canary
#   that never runs is worse than no canary, so this set uses phase 5, which
#   always runs and can still read REQUEST_BODY.
#
#   If you specifically need phase 4 (Apache with SecResponseBodyAccess On),
#   change phase:5 to phase:4 on all five rules. Do not run both.
#
# IMPORTANT: a phase:5 rule is not reached for a request that an earlier phase
# denied. While enforcement rules 201-205 are active, these canaries will only
# fire for traffic that slipped past them (e.g. a downgraded rule, an excluded
# path, or a body that was not retained). To tune, do ONE of:
#
#   (a) Comment out rules 201-205 and keep 211-215 live, or
#   (b) Keep the file as-is and remove the block rules by ID:
#         SecRuleRemoveById 2026106201
#         SecRuleRemoveById 2026106202
#         SecRuleRemoveById 2026106203
#         SecRuleRemoveById 2026106204
#         SecRuleRemoveById 2026106205
#       then reload. Restore the IDs once you have a false-positive baseline.
#
# Coraza note: phase:5 logging is supported, but some Coraza builds garbage-
# collect REQUEST_BODY after phase:2. If body canaries never fire, mirror them
# at phase:2 with `pass,log` instead.
#
# WHERE THE HITS GO: a non-disruptive `pass,log` rule does not produce an
# "Access denied" error-log line, so the canaries use the `auditlog` action to
# force the transaction into the audit log even under SecAuditEngine
# RelevantOnly. Point SecAuditLog at a file/collector your pipeline reads, or
# the canaries will match silently:
#     SecAuditEngine RelevantOnly
#     SecAuditLog /var/log/modsec_audit.log
#     SecAuditLogParts ABFHZ
# (Verified behavior: on a clean request only the enforcement rules deny;
# with 201-205 removed, 211-215 all match and appear in the audit log without
# changing the response status.)
#
# All canaries carry tag:'canary' and tag:'detect-only' so you can route them
# to a separate log/dashboard and suppress them from paging.
# =============================================================================

# [211] canary: chunked multipart, no Content-Length
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" \
    "id:2026106211,phase:5,pass,log,auditlog,chain,\
     msg:'php2shell CANARY: chunked multipart with no Content-Length (would block)',\
     tag:'CVE-2026-109618',tag:'php2shell',tag:'canary',tag:'detect-only',\
     severity:'WARNING',t:none"
    SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)chunked" "t:none,chain"
        SecRule &REQUEST_HEADERS:Content-Length "@eq 0" "t:none"

# [212] canary: multipart PUT/PATCH/DELETE
SecRule REQUEST_METHOD "@rx ^(PUT|PATCH|DELETE)$" \
    "id:2026106212,phase:5,pass,log,auditlog,chain,\
     msg:'php2shell CANARY: multipart %{REQUEST_METHOD} (would block)',\
     tag:'CVE-2026-109619',tag:'php2shell',tag:'canary',tag:'detect-only',\
     severity:'WARNING',t:none"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" "t:none"

# [213] canary: part-header flood
SecRule REQUEST_BODY "@rx (?:\r\nX-[A-Za-z0-9-]{1,64}\x3a[^\r\n]*){40,}" \
    "id:2026106213,phase:5,pass,log,auditlog,\
     msg:'php2shell CANARY: part-header flood (would block)',\
     tag:'CVE-2026-109618',tag:'php2shell',tag:'canary',tag:'detect-only',\
     severity:'WARNING',t:none"

# [214] canary: deep field-name nesting
SecRule REQUEST_BODY "@rx (name\x3d\x22[^\x22\r\n]{0,100}(\[[^\[\]\x22\r\n]{1,32}\]){5,}\x22[\s\S]{0,200}?){10,}" \
    "id:2026106214,phase:5,pass,log,auditlog,\
     msg:'php2shell CANARY: deeply nested multipart field names (would block)',\
     tag:'CVE-2026-109618',tag:'php2shell',tag:'canary',tag:'detect-only',\
     severity:'WARNING',t:none"

# [215] canary: giant filename
SecRule REQUEST_BODY "@rx (?i)filename\x3d\x22[^\x22]{65535}[^\x22]" \
    "id:2026106215,phase:5,pass,log,auditlog,\
     msg:'php2shell CANARY: multipart filename >= 64 KiB (would block)',\
     tag:'CVE-2026-109619',tag:'php2shell',tag:'canary',tag:'detect-only',\
     severity:'WARNING',t:none"

# =============================================================================
# TUNING
# =============================================================================
#
# Downgrade one enforcement rule to log-only without editing this file:
#
#   SecRuleUpdateActionById 2026106202 "pass"
#
# (Useful for the multipart-PUT rule if an API depends on it. "pass" replaces
# the disruptive action; the rule still logs.)
#
# Exclude a known-good path (example: an internal upload API):
#
#   SecRule REQUEST_URI "@beginsWith /api/v2/assets" \
#       "id:2026106290,phase:1,pass,nolog,ctl:ruleRemoveById=2026106202"
#
# Do NOT exclude by Content-Type alone: the exploit sets the same
# multipart/form-data header as legitimate traffic.
#
# False-positive triage:
#   * 2026106201 — some proxies legitimately stream chunked multipart without a
#     content length. Verify the client; if it is an internal service, exempt
#     its source IP rather than disabling the rule.
#   * 2026106202 — REST APIs doing multipart PUT. Exempt the path.
#   * 2026106203 — 40+ X- headers is not a normal client shape; if it fires,
#     capture the body before changing the threshold.
#   * 2026106204 — rich form builders can nest a few levels; 10 fields x 5
#     levels is not a browser-generated shape.
#   * 2026106205 — no legitimate filename approaches 64 KiB.
#
# Log correlation: a true positive is usually a burst of 2026106201/205
# followed by an HTTP 500 ("Allowed memory size ... exhausted in Unknown on
# line 0") and then normal 200s from the same source — the worker survived the
# OOM and is armed. Feed these rule IDs into the same alert as the Sigma
# web_php_fatal_corruption_sequence rule in ../sigma/.
#
# REMINDER: WAF rules are compensating controls. The only complete fix is the
# patched PHP release (8.2.35 / 8.3.36 / 8.4.27 / 8.5.12, 2026-10-21).
# =============================================================================